name: Upload file from URL to Release

on:
  workflow_dispatch:
    inputs:
      file_name:
        description: "File name (e.g. app.apk)"
        required: true
        type: string
      file_url:
        description: "Direct download URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download file
        env:
          FILE_NAME: ${{ inputs.file_name }}
          FILE_URL: ${{ inputs.file_url }}
        run: |
          curl -fL --retry 3 -o "$FILE_NAME" "$FILE_URL"
          ls -lh "$FILE_NAME"

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE_NAME: ${{ inputs.file_name }}
          FILE_URL: ${{ inputs.file_url }}
          TAG: upload-${{ github.run_number }}
        run: |
          gh release create "$TAG" "$FILE_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$FILE_NAME" \
            --notes "Uploaded from: $FILE_URL"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILE_NAME" >> "$GITHUB_STEP_SUMMARY"
